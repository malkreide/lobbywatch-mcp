name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Der Schritt oben prüft nur die line-length dieses Repos (100).
      # scripts/ wird aber zwischen den Portfolio-Repos kopiert, und dort
      # steht line-length auf 88, 100, 110 oder 120. `ruff format` zieht
      # einen Ausdruck zusammen, sobald er in die jeweilige Breite passt —
      # eine Zeile über 88 Zeichen ist hier also formatgerecht und fällt
      # im nächsten Repo um. Genau so ist der Check schon einmal rot
      # geworden, ohne dass am Skript etwas falsch gewesen wäre.
      - name: Format-Stabilität der Portfolio-Skripte
        run: |
          for ll in 88 100 110 120; do
            if ! ruff format --check --line-length "$ll" scripts/; then
              echo "::error::scripts/ ist bei line-length $ll nicht formatgerecht. Die Dateien werden portfolioweit kopiert und müssen bei jeder genutzten Breite gleich formatiert sein — Begründung im Modul-Docstring."
              exit 1
            fi
          done

      - name: Test (offline only)
        run: pytest -m "not live" -q

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
