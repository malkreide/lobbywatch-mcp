name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Der Schritt oben prüft nur die line-length dieses Repos (100).
      # check_version_sync.py wird aber zwischen den Portfolio-Repos kopiert,
      # und dort steht line-length auf 88, 100, 110 oder 120. `ruff format`
      # zieht einen Ausdruck zusammen, sobald er in die jeweilige Breite
      # passt — eine Zeile über 88 Zeichen ist hier also formatgerecht und
      # fällt im nächsten Repo um. Genau so ist der Check schon einmal rot
      # geworden, ohne dass am Skript etwas falsch gewesen wäre.
      #
      # Bewusst die einzelne Datei und nicht `scripts/`: Die Forderung gilt
      # nur für portfolioweit kopierte Dateien. Ein Skript, das es nur hier
      # gibt, hat keinen Grund, breitenunabhängig zu sein — es mitzuprüfen
      # wäre ein Fehlalarm. In swiss-snb-mcp ist genau das passiert, wo
      # `scripts/` ein zweites, lokales Skript enthält. Kommt hier ein
      # weiteres geteiltes Skript dazu, gehört es in diese Liste.
      - name: Format-Stabilität der Portfolio-Skripte
        run: |
          for ll in 88 100 110 120; do
            if ! ruff format --check --line-length "$ll" scripts/check_version_sync.py; then
              echo "::error file=scripts/check_version_sync.py::Nicht formatgerecht bei line-length $ll. Die Datei wird portfolioweit kopiert und muss bei jeder genutzten Breite gleich formatiert sein — Begründung im Modul-Docstring."
              exit 1
            fi
          done

      - name: Test (offline only)
        run: pytest -m "not live" -q

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
